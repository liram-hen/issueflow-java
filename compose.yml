services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-issueflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-issueflow}
      POSTGRES_DB: ${DB_NAME:-issueflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  #  volumes:
   #   - type: bind
   #     source: ./data
   #     target: /var/lib/postgresql/data --> in case u need to save data to local storage
    ports:
      - target: 5432
        published: ${DB_PORT:-5432}
        protocol: tcp
